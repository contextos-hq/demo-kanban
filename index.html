<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Компания HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f1ec;
      --bg-soft: #faf9f6;
      --surface: #ffffff;
      --ink: #171717;
      --muted: #737373;
      --line: #e7e4dc;
      --line-strong: #d6d2c8;
      --blue: #2f6fed;
      --blue-deep: #1f54c7;
      --shadow: 0 1px 2px rgba(23, 23, 23, 0.04);
      --shadow-card: 0 1px 2px rgba(23, 23, 23, 0.05), 0 0 0 1px rgba(23, 23, 23, 0.03);
      --shadow-lift: 0 10px 28px rgba(23, 23, 23, 0.12);
      --radius: 10px;
      --font: "DM Sans", "Segoe UI", system-ui, sans-serif;
      --todo-bg: #efe6ff;
      --todo-ink: #6d28d9;
      --todo-dot: #8b5cf6;
      --progress-bg: #fff3cc;
      --progress-ink: #a16207;
      --progress-dot: #eab308;
      --review-bg: #e4efff;
      --review-ink: #1d4ed8;
      --review-dot: #3b82f6;
      --done-bg: #ddf7e8;
      --done-ink: #047857;
      --done-dot: #10b981;
      --tabs-bg: rgba(255, 255, 255, 0.55);
      --tabs-border: rgba(23, 23, 23, 0.05);
      --pill: #ffffff;
      --glow-a: #efe8ff;
      --glow-b: #e8f3ff;
      --column-bg: rgba(255, 255, 255, 0.28);
      --column-border: rgba(255, 255, 255, 0.45);
      --hover-fill: rgba(255, 255, 255, 0.8);
      --field-bg: #faf9f6;
      --danger-bg: #fff5f5;
      --danger-ink: #b91c1c;
      --danger-line: #fecaca;
      --tick-line: #d0cbc0;
      --toolbar-line: rgba(23, 23, 23, 0.06);
    }

    html[data-theme="dark"] {
      --bg: #12141a;
      --bg-soft: #1a1d26;
      --surface: #1e222c;
      --ink: #f2f3f7;
      --muted: #9aa3b5;
      --line: #2c3340;
      --line-strong: #3a4354;
      --blue: #5b8cff;
      --blue-deep: #3d6ef0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04);
      --shadow-lift: 0 14px 36px rgba(0, 0, 0, 0.45);
      --todo-bg: #2a2140;
      --todo-ink: #c4b5fd;
      --todo-dot: #a78bfa;
      --progress-bg: #3a3218;
      --progress-ink: #fcd34d;
      --progress-dot: #eab308;
      --review-bg: #1c2c4a;
      --review-ink: #93c5fd;
      --review-dot: #60a5fa;
      --done-bg: #16352a;
      --done-ink: #6ee7b7;
      --done-dot: #34d399;
      --tabs-bg: rgba(255, 255, 255, 0.04);
      --tabs-border: rgba(255, 255, 255, 0.06);
      --pill: #2a303c;
      --glow-a: #241b3a;
      --glow-b: #152033;
      --column-bg: rgba(255, 255, 255, 0.03);
      --column-border: rgba(255, 255, 255, 0.06);
      --hover-fill: rgba(255, 255, 255, 0.06);
      --field-bg: #171b24;
      --danger-bg: #2a1618;
      --danger-ink: #fca5a5;
      --danger-line: #7f1d1d;
      --tick-line: #4b5568;
      --toolbar-line: rgba(255, 255, 255, 0.06);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 500px at 10% -10%, var(--glow-a) 0%, transparent 55%),
        radial-gradient(900px 420px at 95% 0%, var(--glow-b) 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      font: 14px/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
      transition: background 0.35s ease, color 0.25s ease;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px 4px;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(145deg, #111 0%, #333 100%);
      display: grid;
      place-items: center;
      flex: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }
    html[data-theme="dark"] .logo {
      background: linear-gradient(145deg, #f8fafc 0%, #cbd5e1 100%);
    }
    html[data-theme="dark"] .logo path { stroke: #111; }
    .logo svg { width: 14px; height: 14px; }
    .brand {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .theme-toggle {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      flex: none;
    }
    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
    }
    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .icon-moon { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 22px 14px;
      border-bottom: 1px solid var(--toolbar-line);
    }

    .tabs {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: nowrap;
      padding: 4px;
      background: var(--tabs-bg);
      border: 1px solid var(--tabs-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      overflow-x: auto;
    }
    .tab-indicator {
      position: absolute;
      top: 4px;
      left: 0;
      height: calc(100% - 8px);
      border-radius: 10px;
      background: var(--pill);
      box-shadow: var(--shadow-card);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 0;
    }
    .tab {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 560;
      white-space: nowrap;
      transition: color 0.2s ease;
    }
    .tab svg { width: 15px; height: 15px; opacity: 0.9; }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] {
      color: var(--ink);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: none;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--hover-fill); color: var(--ink); }
    .icon-btn[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-card);
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .search-box {
      display: none;
      align-items: center;
      margin-right: 4px;
    }
    .search-box.open { display: inline-flex; }
    .search-box input {
      width: 180px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
    }
    .search-box input:focus {
      border-color: rgba(47, 111, 237, 0.55);
      box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
    }

    .new-btn {
      display: inline-flex;
      align-items: stretch;
      margin-left: 8px;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, #3b82f6, var(--blue));
      color: #fff;
      box-shadow: 0 6px 16px rgba(47, 111, 237, 0.28);
    }
    .new-btn > span,
    .new-btn > button {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 8px 13px;
      font-weight: 650;
    }
    .new-btn > button {
      border-left: 1px solid rgba(255, 255, 255, 0.25);
      padding-inline: 9px;
      display: grid;
      place-items: center;
    }
    .new-btn:hover { filter: brightness(1.05); }
    .new-btn svg { width: 12px; height: 12px; }

    .board-wrap {
      flex: 1;
      overflow: auto;
      padding: 20px 18px 48px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(250px, 1fr));
      gap: 16px;
      align-items: start;
      min-width: 1040px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .board.is-switching {
      opacity: 0.45;
      transform: translateY(8px);
    }
    .column {
      min-height: 320px;
      border-radius: 16px;
      padding: 8px;
      background: var(--column-bg);
      border: 1px solid var(--column-border);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .column.drag-over {
      background: var(--hover-fill);
      box-shadow: inset 0 0 0 1px rgba(47, 111, 237, 0.35);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      border: 0;
      margin: 2px 2px 12px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: text;
      box-shadow: inset 0 0 0 1px rgba(23, 23, 23, 0.04);
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.45);
    }
    .pill[data-tone="todo"] { background: var(--todo-bg); color: var(--todo-ink); }
    .pill[data-tone="todo"] .pill-dot { background: var(--todo-dot); }
    .pill[data-tone="progress"] { background: var(--progress-bg); color: var(--progress-ink); }
    .pill[data-tone="progress"] .pill-dot { background: var(--progress-dot); }
    .pill[data-tone="review"] { background: var(--review-bg); color: var(--review-ink); }
    .pill[data-tone="review"] .pill-dot { background: var(--review-dot); }
    .pill[data-tone="done"] { background: var(--done-bg); color: var(--done-ink); }
    .pill[data-tone="done"] .pill-dot { background: var(--done-dot); }

    .pill-name {
      font-weight: 700;
      font-size: 13px;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .pill-count {
      color: inherit;
      opacity: 0.72;
      font-weight: 650;
      font-size: 12px;
    }
    .pill-edit {
      width: 140px;
      border: 1px solid var(--blue);
      border-radius: 7px;
      padding: 3px 7px;
      outline: none;
      font-weight: 700;
      font-size: 13px;
      background: var(--surface);
      color: var(--ink);
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 20px;
    }

    .card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 11px 12px;
      box-shadow: var(--shadow-card);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      transition: box-shadow 0.14s ease, transform 0.14s ease;
    }
    html.is-touch-dragging,
    html.is-touch-dragging body {
      overflow: hidden;
      touch-action: none;
    }
    html.is-touch-dragging .card {
      touch-action: none;
    }
    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(23, 23, 23, 0.08), 0 0 0 1px rgba(23, 23, 23, 0.04);
    }
    html.is-dragging,
    html.is-dragging * {
      cursor: grabbing !important;
    }
    .card.dragging {
      opacity: 0.22;
      cursor: grabbing;
    }
    /* Only touch-drag disables hits on the source; HTML5 DnD breaks if we do it for mouse */
    .card.dragging-touch {
      pointer-events: none;
    }
    .card.drop-before {
      box-shadow:
        0 -3px 0 0 rgba(47, 111, 237, 0.85),
        var(--shadow-card);
    }
    .card.drop-after {
      box-shadow:
        0 3px 0 0 rgba(47, 111, 237, 0.85),
        var(--shadow-card);
    }
    .card.drag-ghost {
      position: fixed;
      margin: 0;
      transform: rotate(8deg) scale(1.03);
      transform-origin: center center;
      box-shadow: var(--shadow-lift);
      opacity: 1;
      pointer-events: none;
      z-index: 2000;
      cursor: grabbing;
    }
    .card-icon {
      width: 15px;
      height: 15px;
      flex: none;
      color: #8a8a8a;
    }
    .card-icon.accent { color: var(--blue); }
    .card-icon.warn { color: #ca8a04; }
    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 560;
      line-height: 1.35;
      word-break: break-word;
    }
    .card-people {
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
      min-height: 22px;
    }
    /* Keep avatars under the title text when a leading icon is present */
    .card-head:has(.card-icon) + .card-people {
      padding-left: 23px;
    }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      margin-left: -6px;
      display: inline-grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      flex: none;
    }
    .avatar:first-child { margin-left: 0; }

    .drop-slot {
      height: 6px;
      border-radius: 6px;
      margin: -2px 0;
      transition: height 0.12s ease, background 0.12s ease, margin 0.12s ease;
    }
    html.is-dragging .drop-slot {
      height: 14px;
      margin: 2px 0;
    }
    .drop-slot.active {
      height: 36px;
      background: rgba(47, 111, 237, 0.1);
      border: 1px dashed rgba(47, 111, 237, 0.45);
      margin: 4px 0;
    }

    .new-page {
      margin-top: 8px;
      width: 100%;
      border: 0;
      background: transparent;
      color: #9a958c;
      text-align: left;
      padding: 9px 10px;
      border-radius: 9px;
      font-weight: 560;
    }
    .new-page:hover {
      background: var(--hover-fill);
      color: var(--ink);
    }

    .composer {
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid rgba(47, 111, 237, 0.45);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: var(--shadow-lift);
    }
    .composer input {
      width: 100%;
      border: 0;
      outline: none;
      padding: 4px 2px;
      background: transparent;
      color: var(--ink);
    }
    .composer-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      justify-content: flex-end;
    }
    .composer-actions button,
    .modal-actions button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 600;
    }
    .composer-actions .primary,
    .modal-actions .primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .modal-actions .danger {
      border-color: var(--danger-line);
      background: var(--danger-bg);
      color: var(--danger-ink);
      margin-right: auto;
    }

    .toasts {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 80;
      pointer-events: none;
    }
    .toast {
      min-width: 220px;
      max-width: 320px;
      background: #171717;
      color: #fff;
      padding: 11px 14px;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      font-size: 13px;
      font-weight: 560;
      opacity: 0;
      transform: translateY(8px);
      animation: toast-in 0.18s ease forwards;
    }
    .toast.hide { animation: toast-out 0.18s ease forwards; }
    @keyframes toast-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

    .menu {
      position: fixed;
      z-index: 70;
      min-width: 190px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-lift);
      padding: 6px;
      display: none;
      color: var(--ink);
    }
    .menu.open { display: block; }
    .menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 9px 11px;
      border-radius: 8px;
      font-weight: 560;
    }
    .menu button:hover { background: var(--hover-fill); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 25, 0.45);
      backdrop-filter: blur(3px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }

    .modal {
      width: min(480px, 100%);
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow-lift);
      border: 1px solid var(--line);
      overflow: hidden;
      transform: translateY(8px) scale(0.98);
      opacity: 0;
      transition: transform 0.16s ease, opacity 0.16s ease;
      color: var(--ink);
    }
    .overlay.open .modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .modal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 8px;
    }
    .modal-kicker {
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 9px;
      background: var(--field-bg);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }
    .modal-close:hover { background: var(--hover-fill); color: var(--ink); }
    .modal-body { padding: 8px 18px 18px; }
    .field { margin-top: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      background: var(--field-bg);
      color: var(--ink);
    }
    .field input[type="text"]:focus {
      border-color: rgba(47, 111, 237, 0.55);
      box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
      background: var(--surface);
    }
    .people-grid {
      display: grid;
      gap: 6px;
    }
    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--field-bg);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .person:hover { background: var(--hover-fill); }
    .person[aria-pressed="true"] {
      border-color: rgba(47, 111, 237, 0.45);
      background: color-mix(in srgb, var(--blue) 12%, var(--surface));
    }
    .person .meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      line-height: 1.25;
    }
    .person .name {
      display: block;
      font-weight: 650;
      font-size: 13.5px;
      color: var(--ink);
    }
    .person .role {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }
    .person .avatar {
      margin-left: 0;
      width: 28px;
      height: 28px;
      font-size: 11px;
    }
    .person .tick {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--tick-line);
      display: grid;
      place-items: center;
      color: transparent;
      font-size: 11px;

  applyTheme(localStorage.getItem(THEME_KEY) || 'light');

    var current = document.documentElement.getAttribute('data-theme');

  function moveTabIndicator() {
    var active = tabsEl.querySelector('.tab[aria-selected="true"]');
    if (!active || !tabIndicator) return;
    tabIndicator.style.width = active.offsetWidth + 'px';
    tabIndicator.style.transform = 'translateX(' + active.offsetLeft + 'px)';

  var drag = {
    cardId: null,
    fromCol: null,
    moved: false,
    ghost: null,
    offsetX: 0,
    offsetY: 0,
    sourceEl: null,
    mode: null,

  var touchDrag = {
    timer: null,
    startX: 0,
    startY: 0,
    lastX: 0,

    el: null,

  // Transparent pixel — hides the browser drag badge (globe / +) next to the cursor

  emptyDragImg.src =
    'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  function placeDragGhost(clientX, clientY) {
    if (!drag.ghost || (clientX === 0 && clientY === 0)) return;
    drag.ghost.style.left = clientX - drag.offsetX + 'px';
    drag.ghost.style.top = clientY - drag.offsetY + 'px';
  }

  function clearDragGhost() {
    if (drag.ghost) {
      drag.ghost.remove();
      drag.ghost = null;

  }

  function clearDropHighlights() {
    Array.prototype.forEach.call(
      document.querySelectorAll(
        '.drop-slot.active, .column.drag-over, .card.drop-before, .card.drop-after',
      ),

        node.classList.remove('active', 'drag-over', 'drop-before', 'drop-after');
      },

  }

  function endDragUi() {
    clearDragGhost();
    clearDropHighlights();
    if (drag.sourceEl) {
      drag.sourceEl.classList.remove('dragging', 'dragging-touch');
    }
    document.documentElement.classList.remove('is-dragging', 'is-touch-dragging');

  function beginCardDrag(el, cardId, colId, clientX, clientY, mode) {
    drag.cardId = cardId;

    if (!el || !el.closest) return;

  var editing = { mode: 'edit', cardId: null, columnId: null, assignees: [] };

  }

  function findCard(cardId) {
    for (var i = 0; i < state.columns.length; i++) {
      var col = state.columns[i];
      for (var j = 0; j < col.cards.length; j++) {
        if (col.cards[j].id === cardId) {
          return { column: col, index: j, card: col.cards[j] };
        }
      }
    }
    return null;
  }

  function viewIsFiltered() {
    return view.sortAZ || view.onlyAssigned || !!view.query || (state.activeTab && state.activeTab !== 'company');
  }

  /** Slot index in the visible list → real index in column.cards */
  function realInsertIndex(toCol, visibleSlotIndex) {
    var visible = visibleCards(toCol);
    if (visibleSlotIndex == null || visibleSlotIndex < 0) {
      return toCol.cards.length;
    }
    if (visibleSlotIndex >= visible.length) {
      if (!visible.length) return toCol.cards.length;
      var last = findCard(visible[visible.length - 1].id);
      return last ? last.index + 1 : toCol.cards.length;
    }
    var target = findCard(visible[visibleSlotIndex].id);
    return target ? target.index : toCol.cards.length;
  }

  function moveCard(cardId, toColId, toIndex) {
    var found = findCard(cardId);
    var toCol = findColumn(toColId);
    if (!found || !toCol) return;

    var fromColId = found.column.id;
    var fromIndex = found.index;
    var index = realInsertIndex(toCol, toIndex);

    // Same column: drop on self or the slot right after = no real move
    if (
      fromColId === toColId &&
      (index === fromIndex || index === fromIndex + 1)
    ) {
      return;
    }

    found.column.cards.splice(fromIndex, 1);
    if (fromColId === toColId && index > fromIndex) index -= 1;
    if (index < 0) index = 0;
    if (index >= toCol.cards.length) toCol.cards.push(found.card);
    else toCol.cards.splice(index, 0, found.card);

    saveBoard();
    render();
    toast(
      fromColId === toColId
        ? 'Порядок в колонке обновлён'
        : 'Карточка перемещена',
    );
  }

  function renameColumn(colId, name) {
    var col = findColumn(colId);
    if (!col) return;
    var next = String(name || '').trim();
    if (!next || next === col.name) {
      render();
      return;
    }
    col.name = next;
    saveBoard();
    render();
    toast('Колонка переименована');
  }

  function addCard(colId, title, assignees) {
    var col = findColumn(colId);
    if (!col) return null;
    var text = String(title || '').trim();
    if (!text) return null;
    var card = {
      id: uid('c'),
      title: text,
      icon: 'none',
      assignees: Array.isArray(assignees) ? assignees.slice() : []
    };
    col.cards.push(card);
    saveBoard();
    render();
    toast('Карточка создана');
    return card;
  }

  function deleteCard(cardId) {
    var found = findCard(cardId);
    if (!found) return;
    found.column.cards.splice(found.index, 1);
    saveBoard();
    closeModal();
    render();
    toast('Карточка удалена');
  }

  function openModalShell() {
    overlayEl.classList.add('open');
    overlayEl.setAttribute('aria-hidden', 'false');
    window.setTimeout(function () {
      modalName.focus();
      modalName.select();
    }, 30);
  }

  function openModal(cardId) {
    var found = findCard(cardId);
    if (!found) return;
    editing.mode = 'edit';
    editing.cardId = cardId;
    editing.columnId = found.column.id;
    editing.assignees = (found.card.assignees || []).slice();
    modalName.value = found.card.title;
    modalTitle.textContent = found.card.title;
    modalDelete.style.display = '';
    modalSave.textContent = 'Сохранить';
    renderPeople();
    openModalShell();
  }

  function openCreateModal(colId) {
    var col = findColumn(colId) || state.columns[0];
    if (!col) return;
    editing.mode = 'create';
    editing.cardId = null;
    editing.columnId = col.id;
    editing.assignees = [];
    modalName.value = '';
    modalTitle.textContent = 'Новая карточка';
    modalDelete.style.display = 'none';
    modalSave.textContent = 'Создать';
    renderPeople();
    openModalShell();
  }

  function closeModal() {
    editing.mode = 'edit';
    editing.cardId = null;
    editing.columnId = null;
    editing.assignees = [];
    overlayEl.classList.remove('open');
    overlayEl.setAttribute('aria-hidden', 'true');
  }

  function saveModal() {
    var next = String(modalName.value || '').trim();
    if (!next) {
      toast('Введите название');
      modalName.focus();
      return;
    }
    if (editing.mode === 'create') {
      addCard(editing.columnId || state.columns[0].id, next, editing.assignees);
      closeModal();
      return;
    }
    var found = findCard(editing.cardId);
    if (!found) return closeModal();
    found.card.title = next;
    found.card.assignees = editing.assignees.slice();
    saveBoard();
    closeModal();
    render();
    toast('Карточка сохранена');
  }

  function renderPeople() {
    modalPeople.innerHTML = '';
    PEOPLE.forEach(function (person) {
      var pressed = editing.assignees.indexOf(person.id) !== -1;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'person';
      btn.setAttribute('aria-pressed', pressed ? 'true' : 'false');
      var avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.style.background = person.color;
      avatar.textContent = person.initials;
      var meta = document.createElement('span');
      meta.className = 'meta';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = person.name;
      var role = document.createElement('span');
      role.className = 'role';
      role.textContent = person.role;
      meta.appendChild(name);
      meta.appendChild(role);
      var tick = document.createElement('span');
      tick.className = 'tick';
      tick.textContent = '✓';
      btn.appendChild(avatar);
      btn.appendChild(meta);
      btn.appendChild(tick);
      btn.addEventListener('click', function () {
        var idx = editing.assignees.indexOf(person.id);
        if (idx === -1) editing.assignees.push(person.id);
        else editing.assignees.splice(idx, 1);
        renderPeople();
      });
      modalPeople.appendChild(btn);
    });
  }

  function cardMatchesView(card, col) {
    var tab = state.activeTab || 'company';
    if (tab === 'mine' && (card.assignees || []).indexOf(ME) === -1) return false;
    if (tab === 'sprint' && col.id !== 'progress' && col.id !== 'review') return false;
    if (tab === 'timeline' && col.id === 'todo') return false;
    if (view.onlyAssigned && !(card.assignees && card.assignees.length)) return false;
    if (view.query) {
      var q = view.query.toLowerCase();
      if (String(card.title || '').toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  function visibleCards(col) {
    var cards = (col.cards || []).filter(function (card) {
      return cardMatchesView(card, col);
    });
    if (view.sortAZ) {
      cards = cards.slice().sort(function (a, b) {
        return String(a.title).localeCompare(String(b.title), 'ru');
      });
    }
    return cards;
  }

  function startRename(colId, pillEl) {
    var col = findColumn(colId);
    if (!col) return;
    var input = document.createElement('input');
    input.className = 'pill-edit';
    input.value = col.name;
    input.setAttribute('aria-label', 'Название колонки');
    pillEl.querySelector('.pill-name').replaceWith(input);
    input.focus();
    input.select();
    function commit() { renameColumn(colId, input.value); }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); render(); }
    });
    input.addEventListener('blur', commit);
  }

  function cardNode(card, colId) {
    var el = document.createElement('article');
    el.className = 'card';
    el.draggable = true;
    el.dataset.cardId = card.id;
    el.dataset.colId = colId;

    var body = document.createElement('div');
    body.className = 'card-body';

    var head = document.createElement('div');
    head.className = 'card-head';
    if (ICONS[card.icon]) head.insertAdjacentHTML('beforeend', ICONS[card.icon]);
    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = card.title;
    head.appendChild(title);
    body.appendChild(head);

    if (card.assignees && card.assignees.length) {
      var people = document.createElement('div');
      people.className = 'card-people';
      card.assignees.slice(0, 4).forEach(function (id) {
        var p = personById(id);
        if (!p) return;
        var av = document.createElement('span');
        av.className = 'avatar';
        av.style.background = p.color;
        av.title = p.name;
        av.textContent = p.initials;
        people.appendChild(av);
      });
      body.appendChild(people);
    }

    el.appendChild(body);

    el.addEventListener('dragstart', function (e) {
      if (touchDrag.armed) {
        e.preventDefault();
        return;
      }
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('application/x-kanban-card', card.id);
      try {
        e.dataTransfer.setDragImage(emptyDragImg, 0, 0);
      } catch (err) {}
      beginCardDrag(el, card.id, colId, e.clientX, e.clientY, 'mouse');
    });
    el.addEventListener('drag', function (e) {
      placeDragGhost(e.clientX, e.clientY);
    });
    el.addEventListener('dragend', function () {
      endDragUi();
      drag.cardId = null;
      drag.fromCol = null;
    });
    el.addEventListener('dragover', function (e) {
      if (!drag.cardId || drag.mode === 'touch' || drag.cardId === card.id) return;
      allowMoveDrop(e);
      drag.moved = true;
      var rect = el.getBoundingClientRect();
      var before = e.clientY < rect.top + rect.height / 2;
      el.classList.toggle('drop-before', before);
      el.classList.toggle('drop-after', !before);
    });
    el.addEventListener('dragleave', function (e) {
      if (el.contains(e.relatedTarget)) return;
      el.classList.remove('drop-before', 'drop-after');
    });
    el.addEventListener('drop', function (e) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('drop-before', 'drop-after');
      var id =
        drag.cardId ||
        e.dataTransfer.getData('application/x-kanban-card') ||
        e.dataTransfer.getData('text/plain');
      if (!id || id === card.id) return;
      var rect = el.getBoundingClientRect();
      var before = e.clientY < rect.top + rect.height / 2;
      var visible = visibleCards(findColumn(colId) || { cards: [] });
      var at = -1;
      for (var i = 0; i < visible.length; i++) {
        if (visible[i].id === card.id) {
          at = i;
          break;
        }
      }
      if (at < 0) return;
      drag.moved = true;
      moveCard(id, colId, before ? at : at + 1);
    });

    el.addEventListener(
      'touchstart',
      function (e) {
        if (e.touches.length !== 1) return;
        var t = e.touches[0];
        touchDrag.startX = t.clientX;
        touchDrag.startY = t.clientY;
        touchDrag.lastX = t.clientX;
        touchDrag.lastY = t.clientY;
        touchDrag.el = el;
        touchDrag.cardId = card.id;
        touchDrag.colId = colId;
        touchDrag.armed = false;
        window.clearTimeout(touchDrag.timer);
        touchDrag.timer = window.setTimeout(function () {
          touchDrag.armed = true;
          beginCardDrag(
            el,
            card.id,
            colId,
            touchDrag.lastX,
            touchDrag.lastY,
            'touch',
          );
          if (navigator.vibrate) {
            try {
              navigator.vibrate(15);
            } catch (err) {}
          }
          document.addEventListener('touchmove', onDocTouchMove, {
            passive: false,
          });
          document.addEventListener('touchend', onDocTouchEnd);
          document.addEventListener('touchcancel', onDocTouchEnd);
        }, 360);
      },
      { passive: true },
    );

    el.addEventListener(
      'touchmove',
      function (e) {
        if (touchDrag.armed || !e.touches.length) return;
        var t = e.touches[0];
        touchDrag.lastX = t.clientX;
        touchDrag.lastY = t.clientY;
        var dist = Math.hypot(
          t.clientX - touchDrag.startX,
          t.clientY - touchDrag.startY,
        );
        if (dist > 12) window.clearTimeout(touchDrag.timer);
      },
      { passive: true },
    );

    el.addEventListener(
      'touchend',
      function () {
        if (!touchDrag.armed) window.clearTimeout(touchDrag.timer);
      },
      { passive: true },
    );

    el.addEventListener('click', function () {
      if (drag.moved) {
        drag.moved = false;
        return;
      }
      openModal(card.id);
    });

    return el;
  }

  function dropSlot(colId, index) {
    var slot = document.createElement('div');
    slot.className = 'drop-slot';
    slot.dataset.colId = colId;
    slot.dataset.index = String(index);
    slot.addEventListener('dragover', function (e) {
      allowMoveDrop(e);
      drag.moved = true;
      slot.classList.add('active');
    });
    slot.addEventListener('dragleave', function () { slot.classList.remove('active'); });
    slot.addEventListener('drop', function (e) {
      e.preventDefault();
      slot.classList.remove('active');
      var id =
        drag.cardId ||
        e.dataTransfer.getData('application/x-kanban-card') ||
        e.dataTransfer.getData('text/plain');
      if (!id) return;
      drag.moved = true;
      moveCard(id, colId, index);
    });
    return slot;
  }

  function renderColumn(col) {
    var wrap = document.createElement('section');
    wrap.className = 'column';
    wrap.dataset.colId = col.id;

    var pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'pill';
    pill.dataset.tone = col.tone;
    pill.title = 'Дважды нажмите, чтобы переименовать';
    pill.innerHTML =
      '<span class="pill-dot"></span>' +
      '<span class="pill-name"></span>' +
      '<span class="pill-count"></span>';
    pill.querySelector('.pill-name').textContent = col.name;
    pill.addEventListener('dblclick', function () { startRename(col.id, pill); });
    wrap.appendChild(pill);

    var list = document.createElement('div');
    list.className = 'cards';
    var cards = visibleCards(col);
    pill.querySelector('.pill-count').textContent = String(cards.length);
    list.appendChild(dropSlot(col.id, 0));
    cards.forEach(function (card, index) {
      list.appendChild(cardNode(card, col.id));
      list.appendChild(dropSlot(col.id, index + 1));
    });
    wrap.appendChild(list);

    var footer = document.createElement('div');
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'new-page';
    add.dataset.new = col.id;
    add.textContent = '+ Новая страница';
    footer.appendChild(add);
    wrap.appendChild(footer);

    wrap.addEventListener('dragover', function (e) {
      allowMoveDrop(e);
      wrap.classList.add('drag-over');
    });
    wrap.addEventListener('dragleave', function (e) {
      if (!wrap.contains(e.relatedTarget)) wrap.classList.remove('drag-over');
    });
    wrap.addEventListener('drop', function (e) {
      if (e.target.closest('.drop-slot') || e.target.closest('.card')) return;
      e.preventDefault();
      wrap.classList.remove('drag-over');
      var id =
        drag.cardId ||
        e.dataTransfer.getData('application/x-kanban-card') ||
        e.dataTransfer.getData('text/plain');
      if (!id) return;
      drag.moved = true;
      // Empty area of the column: append to the end of the visible list
      moveCard(id, col.id, visibleCards(col).length);
    });

    return wrap;
  }

  function render() {
    boardEl.innerHTML = '';
    state.columns.forEach(function (col) {
      boardEl.appendChild(renderColumn(col));
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
      tab.setAttribute('aria-selected', tab.dataset.tab === state.activeTab ? 'true' : 'false');
    });
    window.requestAnimationFrame(moveTabIndicator);
  }

  function switchTab(nextTab) {
    if (!nextTab || nextTab === state.activeTab) {
      moveTabIndicator();
      return;
    }
    state.activeTab = nextTab;
    saveBoard();
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (tab) {
      tab.setAttribute('aria-selected', tab.dataset.tab === state.activeTab ? 'true' : 'false');
    });
    moveTabIndicator();
    boardEl.classList.add('is-switching');
    window.setTimeout(function () {
      render();
      boardEl.classList.remove('is-switching');
    }, 140);
    var labels = {
      company: 'Все задачи компании',
      mine: 'Только мои (Анна Смирнова)',
      sprint: 'Карточки текущего спринта',
      timeline: 'Без бэклога — в работе и дальше'
    };
    toast(labels[state.activeTab] || 'Вид обновлён');
  }

  tabsEl.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    switchTab(tab.dataset.tab);
  });
  window.addEventListener('resize', moveTabIndicator);

  boardEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-new]');
    if (!btn) return;
    openCreateModal(btn.dataset.new);
  });

  function openNewMenu(anchor) {
    var rect = anchor.getBoundingClientRect();
    menuEl.style.left = Math.min(window.innerWidth - 200, rect.left) + 'px';
    menuEl.style.top = rect.bottom + 6 + 'px';
    menuEl.classList.add('open');
  }
  function closeNewMenu() { menuEl.classList.remove('open'); }

  document.getElementById('new-main').addEventListener('click', function () {
    closeNewMenu();
    openCreateModal(state.columns[0] && state.columns[0].id);
  });
  document.getElementById('new-main').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openCreateModal(state.columns[0] && state.columns[0].id);
    }
  });
  document.getElementById('new-menu-btn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (menuEl.classList.contains('open')) closeNewMenu();
    else openNewMenu(e.currentTarget.parentElement);
  });
  menuEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    closeNewMenu();
    if (btn.dataset.action === 'card') {
      openCreateModal(state.columns[0] && state.columns[0].id);
    }
    if (btn.dataset.action === 'reset') {
      state = seedBoard();
      view.sortAZ = false;
      view.onlyAssigned = false;
      view.query = '';
      searchInput.value = '';
      searchBox.classList.remove('open');
      btnSort.setAttribute('aria-pressed', 'false');
      btnFilter.setAttribute('aria-pressed', 'false');
      btnSearch.setAttribute('aria-pressed', 'false');
      saveBoard();
      render();
      toast('Демо сброшено');
    }
  });

  btnSort.addEventListener('click', function () {
    view.sortAZ = !view.sortAZ;
    btnSort.setAttribute('aria-pressed', view.sortAZ ? 'true' : 'false');
    render();
    toast(view.sortAZ ? 'Сортировка А–Я включена' : 'Сортировка выключена');
  });
  btnFilter.addEventListener('click', function () {
    view.onlyAssigned = !view.onlyAssigned;
    btnFilter.setAttribute('aria-pressed', view.onlyAssigned ? 'true' : 'false');
    render();
    toast(view.onlyAssigned ? 'Показаны карточки с ответственными' : 'Фильтр снят');
  });
  btnSearch.addEventListener('click', function () {
    var open = !searchBox.classList.contains('open');
    searchBox.classList.toggle('open', open);
    btnSearch.setAttribute('aria-pressed', open ? 'true' : 'false');
    if (open) searchInput.focus();
    else {
      view.query = '';
      searchInput.value = '';
      render();
    }
  });
  searchInput.addEventListener('input', function () {
    view.query = String(searchInput.value || '').trim();
    render();
  });
  document.getElementById('btn-settings').addEventListener('click', function () {
    view.sortAZ = false;
    view.onlyAssigned = false;
    view.query = '';
    searchInput.value = '';
    searchBox.classList.remove('open');
    btnSort.setAttribute('aria-pressed', 'false');
    btnFilter.setAttribute('aria-pressed', 'false');
    btnSearch.setAttribute('aria-pressed', 'false');
    state.activeTab = 'company';
    saveBoard();
    render();
    toast('Фильтры и вид сброшены');
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', saveModal);
  document.getElementById('modal-delete').addEventListener('click', function () {
    if (!editing.cardId) return;
    deleteCard(editing.cardId);
  });
  overlayEl.addEventListener('click', function (e) {
    if (e.target === overlayEl) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlayEl.classList.contains('open')) closeModal();
  });
  document.addEventListener('click', function () { closeNewMenu(); });

  render();
})();
  </script>
</body>
